name: Temporary Whisper model fetch

on:
  push:
    branches:
      - tmp-fetch-whisper-model-20260819

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download multilingual Whisper small q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -o ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          test "$(stat -c%s ggml-small-q5_1.bin)" -gt 180000000
          sha256sum ggml-small-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-small-q5_1
          path: ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
